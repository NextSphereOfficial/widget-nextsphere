name: CI

on:
  push:
    branches: [ main, staging ]
    tags: ['v*.*.*']
  pull_request:
    branches: [ main, staging ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - name: Set build env
        run: |
          echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "APP_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "APP_BUILD_TIME=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")" >> $GITHUB_ENV
      - name: Build API
        run: pnpm --filter @ns/api build
