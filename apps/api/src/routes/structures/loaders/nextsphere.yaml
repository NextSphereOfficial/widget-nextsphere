  wifi:
    output:
      short: "La rete Wi-Fi si chiama SV Apartments e la password è 12345."

  services:
    output:
      short: "Sono inclusi Wi-Fi, biancheria e i servizi indicati nella tua prenotazione. Se vuoi ti posso dire qualcosa in più sui singoli servizi."

  faq:
    output:
      short: "Posso rispondere alle domande più frequenti su arrivo, soggiorno e partenza. Chiedimi pure quello che ti serve."

  emergency:
    output:
      short: "In caso di emergenza contatta subito il numero unico 112 e, se necessario, avvisa anche l’host."

  contact:
    output:
      short: "Per qualsiasi necessità puoi contattare direttamente l’host usando i recapiti ricevuti con la prenotazione."
