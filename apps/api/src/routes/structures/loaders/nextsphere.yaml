version: 2

meta:
  structure:
    id: nextsphere
    name: "NextSphere Base Template"
  default_locale: it

############################################################
# CONTENUTO BASE (GENERALE)
############################################################

content:

  welcome:
    intro: "Ciao! Sono il concierge digitale. Come posso aiutarti oggi?"

  house_rules:
    general: "Ecco alcune regole generali dell'appartamento."

  smoking:
    general: "In genere non è consentito fumare negli appartamenti."

  pets:
    general: "La politica sugli animali può variare a seconda della struttura."

  visitors:
    general: "In alcune strutture non sono ammessi ospiti esterni senza autorizzazione."

  noise:
    general: "Si raccomanda di rispettare gli orari di silenzio."

  kitchen:
    general: "La cucina può essere utilizzata in base alle regole della struttura."

  bathroom:
    general: "Il bagno è condiviso o privato a seconda dell'appartamento."

  garbage:
    general: "La raccolta dei rifiuti segue le regole locali sulla differenziata."

  damage:
    general: "Se noti un danno, ti chiediamo di segnalarlo."

  wifi:
    info: "La rete Wi-Fi e la password saranno fornite dall'host."

  appliances:
    heating: "Il riscaldamento è regolabile in base alla stagione."
    air_conditioning: "Il condizionatore può avere modalità e limiti di utilizzo specifici."
    water: "Normalmente l'erogazione dell'acqua è autonoma e funzionante."
    electricity: "In caso di blackout, verifica il quadro elettrico o contatta l'host."

  checkin:
    general: "Le istruzioni di check-in verranno fornite dall'host."

  early_checkin:
    general: "Il check-in anticipato dipende dalla disponibilità."

  checkin_parking:
    general: "È possibile che ci sia un parcheggio dedicato per il check-in."

  checkout:
    general: "Le istruzioni di check-out verranno fornite dall'host."

  late_checkout:
    general: "Il late check-out dipende da disponibilità e regolamento della struttura."

  checkout_keys:
    general: "Le modalità di riconsegna delle chiavi possono variare."

  restaurants:
    generic: "Nelle vicinanze dovresti trovare diverse opzioni per mangiare."

  supermarket:
    generic: "In zona solitamente è presente almeno un supermercato."

  pharmacy:
    generic: "Una farmacia si trova di solito nei dintorni dell'appartamento."

  activities:
    generic: "Ci sono varie attività che potresti valutare in base alla zona."

  parking:
    general: "La disponibilità di parcheggio dipende dalla struttura."

  transport:
    general: "I trasporti locali includono bus, tram o metro a seconda della città."

  venice:
    general: "Per raggiungere Venezia solitamente si utilizzano bus, tram o treni."

  emergency:
    general: "In caso di emergenza grave chiama immediatamente il 112."

  emergency_medical:
    general: "Per emergenze mediche serie chiama il 118 o 112."

  fire:
    general: "In caso di incendio esci dall'appartamento e chiama il 115."

  safety:
    general: "Segui le indicazioni di sicurezza fornite dall'host."

  contact:
    generic: "Puoi contattare l'host tramite i recapiti forniti."

  reception:
    generic: "Non tutte le strutture dispongono di una reception fisica."

  support:
    generic: "Sono qui per aiutarti. Descrivimi il problema."

  help_issue:
    generic: "Puoi segnalarmi qualsiasi problema e ti assisterò."

  faq:
    generic: "Ecco alcune domande frequenti che possono esserti utili."

  fallback:
    text: "Mi dispiace, non ho capito bene. Puoi riformulare la domanda?"


############################################################
# INTENTS → OUTPUT
############################################################

intents:

  welcome:
    output:
      short: "{{content.welcome.intro}}"

  fallback:
    output:
      short: "{{content.fallback.text}}"


  # CHECK-IN / CHECK-OUT
  checkin:
    output:
      short: "{{content.checkin.general}}"

  early_checkin:
    output:
      short: "{{content.early_checkin.general}}"

  checkin_parking:
    output:
      short: "{{content.checkin_parking.general}}"

  checkout:
    output:
      short: "{{content.checkout.general}}"

  late_checkout:
    output:
      short: "{{content.late_checkout.general}}"

  checkout_keys:
    output:
      short: "{{content.checkout_keys.general}}"


