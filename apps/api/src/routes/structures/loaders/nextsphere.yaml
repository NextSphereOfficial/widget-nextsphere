# nextsphere.yaml (v2 - schema pulito + scalabile)
meta:
  schema_version: 2
  brand: nextsphere
  description: "Generic NextSphere template: flows + reply keys. Clients override content + copy_overrides."

content:
  hotel:
    name: "NextSphere"

  wifi:
    ssid: ""
    password: ""

  checkin:
    from: ""            # es: "15:00"
    instructions: ""    # testo breve/placeholder

  checkout:
    by: ""              # es: "10:00"
    notes: ""           # placeholder

  house_rules:
    general: ""
    smoking: ""
    pets: ""
    visitors: ""
    quiet_hours: ""
    waste: ""
    damage: ""

  contacts:
    host_phone: ""
    whatsapp: ""
    emergency_number: "112"
    medical_number: ""
    fire_number: ""
    safety_note: ""

  parking:
    note: ""
    address: ""
    maps_url: ""

  breakfast:
    note: ""

  transport:
    general: ""
    to_venice: ""
    airport: ""

  restaurants:
    list: ""

  locale:
    area_hint: ""

  fallback:
    text: "I’m sorry—I didn’t catch that. Could you rephrase?"

intents:
  welcome:
    reply_key: welcome_intro
    vars_from:
      - content.hotel

  wifi:
    reply_key: wifi_credentials
    vars_from:
      - content.wifi
    flow:
      kind: terminal

  checkin:
    reply_key: checkin_instructions
    vars_from:
      - content.checkin
    flow:
      kind: terminal

  # Alias storico
  checkout:
    reply_key: checkout_instructions
    vars_from:
      - content.checkout
    flow:
      kind: terminal

  checkout_time:
    reply_key: checkout_instructions
    vars_from:
      - content.checkout
    flow:
      kind: terminal

  late_checkout:
    reply_key: late_checkout_policy
    vars_from:
      - content.checkout
    flow:
      kind: collect
      collect:
        question_id: desired_time
        slot: late_checkout_time
        format: time
        reply_key: late_checkout_collect_desired_time
        reprompt_reply_key: late_checkout_collect_desired_time_reprompt
      confirm:
        question_id: contact_host_confirm
        reply_key: late_checkout_confirm_contact_host
        on_yes:
          reply_key: late_checkout_confirm_yes
          action: contact_host
        on_no:
          reply_key: late_checkout_confirm_no
          action: close

  house_rules:
    reply_key: house_rules
    vars_from:
      - content.house_rules
    flow:
      kind: terminal

  # Alias storico
  emergency:
    reply_key: emergencies
    vars_from:
      - content.contacts
    flow:
      kind: terminal

  emergency_contacts:
    reply_key: emergencies
    vars_from:
      - content.contacts
    flow:
      kind: terminal

  parking:
    reply_key: parking_info
    vars_from:
      - content.parking
    flow:
      kind: followup
      followup:
        question_id: need_location
        reply_key: parking_followup_need_location

  breakfast:
    reply_key: breakfast_info
    vars_from:
      - content.breakfast
    flow:
      kind: terminal

  transport:
    reply_key: transportation_info
    vars_from:
      - content.transport
    flow:
      kind: terminal

  transport_to_venice:
    reply_key: transportation_to_venice
    vars_from:
      - content.transport
    flow:
      kind: terminal

  transport_airport:
    reply_key: transportation_airport
    vars_from:
      - content.transport
    flow:
      kind: terminal

  restaurants:
    reply_key: restaurants
    vars_from:
      - content.restaurants
    flow:
      kind: explore
      explore:
        prompt_reply_key: restaurants_explore_prompt
        followup_reply_key: restaurants_explore_followup

  fallback:
    output:
      short: "{{content.fallback.text}}"

copy_overrides:
  it: {}
  en: {}
  de: {}
  fr: {}
  es: {}
