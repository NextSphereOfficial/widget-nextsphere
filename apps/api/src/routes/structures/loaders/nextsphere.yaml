intents:

  welcome:
    output:
      short: "Benvenuto! Posso aiutarti con Wi-Fi, arrivo, regole della casa, servizi o emergenze."

  house_rules:
    output:
      short: "Vi preghiamo di tenere un tono basso tra le 23:00 e le 08:00 e di rispettare le regole della casa durante il soggiorno."

  checkin:
    output:
      short: "Potete fare il check-in in totale autonomia seguendo le istruzioni ricevute via mail prima dell'arrivo."

  checkout:
    output:
