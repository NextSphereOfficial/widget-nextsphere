meta:
  schema_version: 2
  brand: sv
  structure:
    id: SV001
    name: S&V Apartments – Mestre
  default_locale: it

content:
  hotel:
    name: S&V Apartments

  wifi:
    ssid: S&V
    password: sv2026!

  checkin:
    from: '15:00'
    extra:
      it: ''
      en: ''
      de: ''
      fr: ''
      es: ''

  checkout:
    by: '10:00'
    notes: ''
    extra:
      it: ''
      en: ''
      de: ''
      fr: ''
      es: ''

  house_rules:
    general: Rispetta i vicini e mantieni pulito l’appartamento.
    smoking: Vietato fumare in casa.
    pets: Animali solo se concordati in anticipo.
    visitors: Ospiti esterni solo se concordati.
    quiet_hours: Silenzio dalle 22:00 alle 8:00.
    waste: Differenzia i rifiuti secondo le istruzioni.
    damage: Segnala subito eventuali danni o problemi.

  contacts:
    host_phone: ''
    whatsapp: ''
    emergency:
      general: 112
      medical: 118
      fire: 115
      safety: 113

  parking:
    note: 'Parcheggio disponibile nelle vicinanze. Verifica segnaletica e zone a pagamento.'
    maps_url: 'https://maps.google.com/?q=Mestre+Parking'

  breakfast:
    note: 'Non inclusa. Bar e colazioni consigliate nelle vicinanze.'

  transport:
    general: 'Da Mestre puoi raggiungere Venezia con bus o treno.'
    to_venice: 'Bus per Venezia: linee ACTV da Mestre verso Piazzale Roma.'
    airport: 'Aeroporto: collegamenti bus dedicati (ATVO/ACTV) e taxi.'

  restaurants:
    list:
      - name: Osteria da Gino
        address: Via Esempio 1, Mestre
        notes: Cucina tipica veneta.
      - name: Trattoria Al Ponte
        address: Via Esempio 2, Mestre
        notes: Ottima pasta e pesce.

  fallback:
    text: 'Non ho informazioni certe su questo. Se vuoi, puoi chiedere all’host tramite la chat della piattaforma.'

intents:
  welcome:
    reply_key: welcome_intro
    vars_from:
      - content.hotel

  wifi:
    reply_key: wifi_credentials
    vars_from:
      - content.wifi
    flow:
      kind: terminal

  checkin:
    reply_key: checkin_instructions
    vars_from:
      - content.checkin
    flow:
      kind: terminal

  checkout:
    reply_key: checkout_instructions
    vars_from:
      - content.checkout
    flow:
      kind: terminal

  checkout_time:
    reply_key: checkout_instructions
    vars_from:
      - content.checkout
    flow:
      kind: terminal

  house_rules:
    reply_key: house_rules
    vars_from:
      - content.house_rules
    flow:
      kind: terminal

  emergency:
    reply_key: emergencies
    vars_from:
      - content.contacts
    flow:
      kind: terminal

  emergency_contacts:
    reply_key: emergencies
    vars_from:
      - content.contacts
    flow:
      kind: terminal

  parking:
    reply_key: parking_info
    vars_from:
      - content.parking
    flow:
      kind: terminal

  breakfast:
    reply_key: breakfast_info
    vars_from:
      - content.breakfast
    flow:
      kind: terminal

  transport:
    reply_key: transportation_info
    vars_from:
      - content.transport
    flow:
      kind: terminal

  transport_to_venice:
    reply_key: transportation_to_venice
    vars_from:
      - content.transport
    flow:
      kind: terminal

  transport_airport:
    reply_key: transportation_airport
    vars_from:
      - content.transport
    flow:
      kind: terminal

  restaurants:
    reply_key: restaurants
    vars_from:
      - content.restaurants
    flow:
      kind: terminal

  fallback:
    output:
      short: '{{content.fallback.text}}'

  late_checkout:
    reply_key: late_checkout_collect_desired_time
    vars_from:
      - content.checkout
    flow:
      kind: collect
      collect:
        question_id: desired_time
        slot: late_checkout_time
        format: time
        reply_key: late_checkout_collect_desired_time
        reprompt_reply_key: late_checkout_collect_desired_time_reprompt

copy_overrides:
  it: {}
  en: {}
  de: {}
  fr: {}
  es: {}
