version: 2

meta:
  structure:
    id: SV001
    name: "S&V Apartments – Mestre"
  default_locale: it

############################################################
# CLIENTE ZERO — VERSIONE CORRETTA
# - niente chiavi duplicate
# - niente testi multilingua “hardcoded”
# - override solo dove ha senso
############################################################

content:
  ##########################################################
  # Override (facoltativi, premium)
  ##########################################################
  copy_overrides:
    welcome_intro: "Ciao! Benvenuto in {{hotel_name}} 😊 Se hai bisogno di qualcosa, sono qui per aiutarti."
    house_rules: |
      Regole principali:
      • {{rules_general}}
      • {{rules_smoking}}
      • {{rules_pets}}
      • {{rules_visitors}}
      • {{rules_quiet_hours}}
      • {{rules_waste}}
      • {{rules_damage}}
    emergencies: |
      Emergenze:
      • Generale: {{emergency_general}}
      • Medica: {{emergency_medical}}
      • Incendio: {{emergency_fire}}
      • Sicurezza: {{emergency_safety}}

  ##########################################################
  # Dati struttura
  ##########################################################
  hotel:
    name: "S&V Apartments"

  ##########################################################
  # Wi-Fi (dati)
  ##########################################################
  wifi:
    ssid: "S&V"
    password: "sv2026!"

  ##########################################################
  # Check-in / Check-out (dati)
  ##########################################################
  checkin:
    from: "15:00"

  checkout:
    by: "10:00"

  ##########################################################
  # Regole (dati atomici)
  ##########################################################
  house_rules:
    general: "Rispetta i vicini e mantieni pulito l’appartamento."
    smoking: "Non è permesso fumare all’interno."
    pets: "Ammessi solo animali di piccola taglia."
    visitors: "Non sono ammessi ospiti non registrati."
    quiet_hours: "Silenzio dopo le 22:00."
    waste: "Raccolta differenziata obbligatoria."
    damage: "Segnala eventuali danni."

  ##########################################################
  # Colazione (dato)
  ##########################################################
  breakfast:
    note: "Non disponibile in struttura."

  ##########################################################
  # Parcheggio (dato)
  ##########################################################
  parking:
    note: "Zone bianche in Via Roma"
    maps_url: "https://maps.google.com/..."

  ##########################################################
  # Trasporti (dati)
  ##########################################################
  transport:
    general: "Tram T1"
    to_venice: "Tram T1 o autobus 4L"
    airport: "Bus dedicato o taxi (Marco Polo / Treviso)"

  ##########################################################
  # Ristoranti (dato)
  ##########################################################
  restaurants:
    list: "Barroca, Fermenti, Ca’ di Mat"

  ##########################################################
  # Emergenze (numeri = dati)
  ##########################################################
  emergencies:
    general: "112"
    medical: "118"
    fire: "115"
    safety: "Avvisaci appena possibile."

  ##########################################################
  # Fallback
  ##########################################################
  fallback:
    text: "Mi dispiace, non ho capito bene. Puoi ripetere la domanda?"

############################################################
# INTENTS
############################################################

intents:

  welcome:
    reply_key: welcome_intro
    vars:
      hotel_name: "{{content.hotel.name}}"

  wifi:
    reply_key: wifi_credentials
    vars:
      ssid: "{{content.wifi.ssid}}"
      password: "{{content.wifi.password}}"

  checkin:
    reply_key: checkin_instructions
    vars:
      checkin_from: "{{content.checkin.from}}"

  checkout:
    reply_key: checkout_instructions
    vars:
      checkout_by: "{{content.checkout.by}}"

  house_rules:
    reply_key: house_rules
    vars:
      rules_general: "{{content.house_rules.general}}"
      rules_smoking: "{{content.house_rules.smoking}}"
      rules_pets: "{{content.house_rules.pets}}"
      rules_visitors: "{{content.house_rules.visitors}}"
      rules_quiet_hours: "{{content.house_rules.quiet_hours}}"
      rules_waste: "{{content.house_rules.waste}}"
      rules_damage: "{{content.house_rules.damage}}"

  breakfast:
    reply_key: breakfast_info
    vars:
      breakfast_info: "{{content.breakfast.note}}"

  parking:
    reply_key: parking_info
    vars:
      parking_note: "{{content.parking.note}}"

  transport:
    reply_key: transportation_info
    vars:
      transportation_info: "{{content.transport.general}}"

  transport_to_venice:
    reply_key: transportation_to_venice
    vars:
      transportation_to_venice: "{{content.transport.to_venice}}"

  transport_airport:
    reply_key: transportation_airport
    vars:
      transportation_airport: "{{content.transport.airport}}"

  restaurants:
    reply_key: restaurants
    vars:
      restaurants: "{{content.restaurants.list}}"

  emergency:
    reply_key: emergencies
    vars:
      emergency_general: "{{content.emergencies.general}}"
      emergency_medical: "{{content.emergencies.medical}}"
      emergency_fire: "{{content.emergencies.fire}}"
      emergency_safety: "{{content.emergencies.safety}}"

  fallback:
    output:
      short: "{{content.fallback.text}}"
