  note: "Non inclusa. Bar e colazioni consigliate nelle vicinanze."

transport:
  # chiavi pronte per it.yaml
  transport_general: "Da Mestre puoi raggiungere Venezia con bus o treno."
  transportation_to_venice: "Bus per Venezia: linee ACTV da Mestre verso Piazzale Roma."
  transportation_airport: "Aeroporto: collegamenti bus dedicati (ATVO/ACTV) e taxi."

  # mantengo legacy
  general: "Da Mestre puoi raggiungere Venezia con bus o treno."
  to_venice: "Bus per Venezia: linee ACTV da Mestre verso Piazzale Roma."
  airport: "Aeroporto: collegamenti bus dedicati (ATVO/ACTV) e taxi."

restaurants:
  # Versione pronta per template (stringa)
