fallback:
  text: "Non ho informazioni certe su questo. Se vuoi, puoi chiedere all’host tramite la chat della piattaforma."

# =========================
# INTENTS (YAML-first)
# =========================

intents:
  welcome:
    reply_key: welcome_intro
    vars_from:
      - hotel

  wifi:
    reply_key: wifi_credentials
    vars_from:
      - wifi
    flow:
      kind: terminal

  checkin:
    reply_key: checkin_instructions
    vars_from:
      - checkin
    flow:
      kind: terminal

  checkout:
    reply_key: checkout_instructions
    vars_from:
      - checkout
    flow:
      kind: terminal

  checkout_time:
    reply_key: checkout_instructions
    vars_from:
      - checkout
    flow:
      kind: terminal

  house_rules:
    reply_key: house_rules
    vars_from:
      - house_rules
    flow:
      kind: terminal

  emergency:
    reply_key: emergencies
    vars_from:
      - contacts
    flow:
      kind: terminal

  emergency_contacts:
    reply_key: emergencies
    vars_from:
      - contacts
    flow:
      kind: terminal

  parking:
    reply_key: parking_info
    vars_from:
      - parking
    flow:
      kind: terminal

  breakfast:
    reply_key: breakfast_info
    vars_from:
      - breakfast
    flow:
      kind: terminal

  transport:
    reply_key: transportation_info
    vars_from:
      - transport
    flow:
      kind: terminal

  transport_to_venice:
    reply_key: transportation_to_venice
    vars_from:
      - transport
    flow:
      kind: terminal

  transport_airport:
    reply_key: transportation_airport
    vars_from:
      - transport
    flow:
      kind: terminal

  restaurants:
    reply_key: restaurants
    vars_from:
      - restaurants
    flow:
      kind: terminal

  late_checkout:
    reply_key: late_checkout_collect_desired_time
    vars_from:
      - checkout
    flow:
      kind: collect
      collect:
        question_id: desired_time
        slot: late_checkout_time
        format: time
        reply_key: late_checkout_collect_desired_time
        reprompt_reply_key: late_checkout_collect_desired_time_reprompt

  fallback:
    output:
      short: "{{fallback.text}}"

copy_overrides:
  it: {}
  en: {}
  de: {}
  fr: {}
  es: {}
