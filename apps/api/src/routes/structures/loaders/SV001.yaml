version: 2

meta:
  structure:
    id: SV001
    name: "S&V Apartments – Mestre"
  default_locale: it

############################################################
# CONTENUTI SPECIFICI DELLA STRUTTURA (STILE SEMPLICE)
############################################################

content:
  copy_overrides:
    welcome_intro: "Ciao! Benvenuto in {{hotel_name}} 😊 Se hai bisogno di qualcosa, sono qui per aiutarti."

    wifi_credentials: "Wi-Fi: {{ssid}} · Password: {{password}}"

    checkin_instructions: "Il check-in viene fatto di persona. L’orario standard è dalle {{checkin_from}} in poi."

    checkout_instructions: "Il check-out è entro le {{checkout_by}}. Lascia le chiavi sul tavolo e chiudi la porta dietro di te."

    house_rules: |
      Regole principali:
      • {{rules_general}}
      • {{rules_smoking}}
      • {{rules_pets}}
      • {{rules_visitors}}
      • {{rules_quiet_hours}}
      • {{rules_waste}}
      • {{rules_damage}}

    emergencies: |
      Emergenze:
      • Generale: {{emergency_general}}
      • Medica: {{emergency_medical}}
      • Incendio: {{emergency_fire}}
      • Sicurezza: {{emergency_safety}}

    parking_info: "{{parking_info}}"
    breakfast_info: "{{breakfast_info}}"

    transportation_info: "{{transportation_info}}"
    transportation_to_venice: "{{transportation_to_venice}}"
    transportation_airport: "{{transportation_airport}}"

    restaurants: "{{restaurants}}"



  hotel:
    name: "S&V Apartments"

  welcome:
    intro: "Ciao! Benvenuto in S&V Apartments 😊 Se hai bisogno di qualcosa, sono qui per aiutarti."

  house_rules:
    general: "Ecco le regole principali dell'appartamento: rispetta i vicini, mantieni pulito e segnala eventuali problemi."
    smoking: "Non è permesso fumare all’interno dell’appartamento. In balcone è predisposto un posacenere."
    pets: "Sono ammessi solo animali di piccole dimensioni e tranquilli."
    visitors: "Non sono ammessi ospiti esterni non registrati."
    quiet_hours: "Si prega di mantenere il silenzio dopo le 22:00."
    waste: "La raccolta differenziata è obbligatoria: trovi i contenitori sotto il lavello."
    damage: "Se noti un danno o qualcosa che non funziona, avvisaci il prima possibile."

  wifi:
    ssid: "S&V"
    password: "sv2026!"


  checkin:
    from: "15:00"
    instructions: "Il check-in viene fatto di persona. L’orario standard è dalle 15:00 in poi."


  early_checkin:
    info: "Il check-in anticipato non è garantito. Contattaci per verificare la disponibilità."

  checkout:
    by: "10:00"
    instructions: "Il check-out è entro le 10:00. Lascia le chiavi sul tavolo e chiudi la porta dietro di te."

  late_checkout:
    info: "Il late check-out non è sempre possibile. Chiedi pure e vediamo se riusciamo a organizzarlo."

  breakfast:
    info: "Non offriamo colazione in struttura. Se vuoi, posso consigliarti bar e locali nelle vicinanze."

  transport:
    airport: "Per l’aeroporto: puoi usare autobus dedicati o taxi. Se mi dici quale aeroporto (Marco Polo / Treviso) ti indico l’opzione migliore."


  checkout_keys:
    instructions: "Per il check-out, lascia le chiavi sul tavolo e chiudi la porta a chiave dall’esterno."

  appliances:
    heating: "Il riscaldamento si controlla dal termostato vicino alla porta."
    air_conditioning: "L’aria condizionata si accende dal telecomando dedicato. Ricorda di spegnerla quando esci."
    water: "Se l’acqua non esce, controlla che il rubinetto generale vicino al bagno sia aperto."
    electricity: "Il quadro elettrico è vicino all’ingresso, sulla sinistra."

  local_area:
    supermarket: "Il supermercato più vicino è appena fuori la via, dall'altro lato della strada."
    pharmacy: "La farmacia si trova in fondo alla strada, sulla sinistra."
    restaurants: "Nel centro di Mestre ti consigliamo: Barroca - per un aperitivo con ottimi panini. Fermenti - ristorante e pizzeria. Ca di Mat per un buon drink."
    activities: "A Mestre puoi trovare parchi, cinema e aree pedonali. Per Venezia c’è il tram."
    parking: "Il parcheggio in strada è gratuito nelle zone bianche. Controlla i cartelli prima di lasciare l’auto."
    transport: "Il tram T1 per Venezia si prende a pochi minuti a piedi. Passa ogni 7–10 minuti."

  venice:
    info: "Per andare a Venezia, prendi il tram T1 o l’autobus 4L. I biglietti si acquistano nei tabaccai, alle macchinette ACTV o tramite app."

  emergencies:
    general: "In caso di emergenza chiama il 112."
    medical: "Per emergenze mediche chiama il 118 o il 112."
    fire: "In caso di incendio esci subito e chiama il 115."
    safety: "Se ti senti in pericolo, chiama il 112 e avvisaci."

  contact:
    host: "Per qualunque necessità contattaci al numero indicato nella casa."

  reception:
    info: "Non c’è reception fisica, ma siamo sempre raggiungibili via telefono o messaggi."

  support:
    generic: "Dimmi pure qual è il problema, ti aiuto subito."

  faq:
    generic: "Puoi chiedermi informazioni su check-in, regole, trasporti, ristoranti e molto altro."

  fallback:
    text: "Mi dispiace, non ho capito bene. Puoi ripetere la domanda?"

############################################################
# INTENTS → OUTPUT
############################################################

intents:

  welcome:
    reply_key: welcome_intro
    vars:
      hotel_name: "{{content.hotel.name}}"
    output:
      short: "{{content.welcome.intro}}"


  fallback:
    output:
      short: "{{content.fallback.text}}"

  # CHECK-IN / CHECK-OUT
  checkin:
    reply_key: checkin_instructions
    vars:
      checkin_from: "{{content.checkin.from}}"
    output:
      short: "{{content.checkin.instructions}}"


  early_checkin:
    output:
      short: "{{content.early_checkin.info}}"

  checkin_parking:
    output:
      short: "{{content.parking}}"

  checkout:
    reply_key: checkout_instructions
    vars:
      checkout_by: "{{content.checkout.by}}"
    output:
      short: "{{content.checkout.instructions}}"


  late_checkout:
    output:
      short: "{{content.late_checkout.info}}"

  checkout_keys:
    output:
      short: "{{content.checkout_keys.instructions}}"

  # DOTAZIONI
  wifi:
    reply_key: wifi_credentials
    vars:
      ssid: "{{content.wifi.ssid}}"
      password: "{{content.wifi.password}}"
    output:
      short: "{{content.wifi.ssid}} {{content.wifi.password}}"


  heating:
    output:
      short: "{{content.appliances.heating}}"

  air_conditioning:
    output:
      short: "{{content.appliances.air_conditioning}}"

  water:
    output:
      short: "{{content.appliances.water}}"

  electricity:
    output:
      short: "{{content.appliances.electricity}}"

  # REGOLE
  house_rules:
    reply_key: house_rules
    vars:
      rules_general: "{{content.house_rules.general}}"
      rules_smoking: "{{content.house_rules.smoking}}"
      rules_pets: "{{content.house_rules.pets}}"
      rules_visitors: "{{content.house_rules.visitors}}"
      rules_quiet_hours: "{{content.house_rules.quiet_hours}}"
      rules_waste: "{{content.house_rules.waste}}"
      rules_damage: "{{content.house_rules.damage}}"
    output:
      short: "{{content.house_rules.general}}"


  smoking:
    output:
      short: "{{content.house_rules.smoking}}"

  pets:
    output:
      short: "{{content.house_rules.pets}}"

  visitors:
    output:
      short: "{{content.house_rules.visitors}}"

  noise:
    output:
      short: "{{content.house_rules.quiet_hours}}"

  kitchen_rules:
    output:
      short: "La cucina è disponibile e puoi usarla liberamente."

  bathroom_rules:
    output:
      short: "Utilizza il bagno con cura e mantienilo pulito."

  garbage:
    output:
      short: "{{content.house_rules.waste}}"

  damage_reporting:
    output:
      short: "{{content.house_rules.damage}}"

  # SERVIZI ESTERNI
  restaurants:
    reply_key: restaurants
    vars:
      restaurants: "{{content.local_area.restaurants}}"
    output:
      short: "{{content.local_area.restaurants}}"


  supermarket:
    output:
      short: "{{content.local_area.supermarket}}"

  pharmacy:
    output:
      short: "{{content.local_area.pharmacy}}"

  what_to_do:
    output:
      short: "{{content.local_area.activities}}"

  parking:
    reply_key: parking_info
    vars:
      parking_info: "{{content.local_area.parking}}"
    output:
      short: "{{content.local_area.parking}}"


  transport:
    reply_key: transportation_info
    vars:
      transportation_info: "{{content.local_area.transport}}"
    output:
      short: "{{content.local_area.transport}}"


  transport_to_venice:
    reply_key: transportation_to_venice
    vars:
      transportation_to_venice: "{{content.venice.info}}"
    output:
      short: "{{content.venice.info}}"


  # EMERGENZE
  emergency:
    reply_key: emergencies
    vars:
      emergency_general: "{{content.emergencies.general}}"
      emergency_medical: "{{content.emergencies.medical}}"
      emergency_fire: "{{content.emergencies.fire}}"
      emergency_safety: "{{content.emergencies.safety}}"
    output:
      short: "{{content.emergencies.general}}"


  emergency_medical:
    output:
      short: "{{content.emergencies.medical}}"

  fire_emergency:
    output:
      short: "{{content.emergencies.fire}}"

  safety_advice:
    output:
      short: "{{content.emergencies.safety}}"

  # SUPPORTO
  contact:
    output:
      short: "{{content.contact.host}}"

  reception:
    output:
      short: "{{content.reception.info}}"

  support:
    output:
      short: "{{content.support.generic}}"

  help_issue:
    output:
      short: "{{content.support.generic}}"

  faq:
    output:
      short: "{{content.faq.generic}}"
