version: 1

intents:

  welcome:
    patterns:
      - "benvenuto"
      - "ciao"
      - "presentati"
    response:
      use: content.welcome.intro

  house_rules:
    patterns:
      - "regole"
      - "norme"
      - "house rules"
    response:
      use: content.house_rules.general

  checkin:
    patterns:
      - "check in"
      - "check-in"
      - "come entrare"
      - "arrivo"
    response:
      use: content.checkin.instructions

  checkout:
    patterns:
      - "check out"
      - "check-out"
      - "partenza"
      - "uscire"
    response:
      use: content.checkout.instructions

  wifi:
    patterns:
      - "wifi"
      - "password"
      - "internet"
    response:
      use: content.services.wifi.info

  services:
    patterns:
      - "servizi"
      - "cosa è incluso"
    response:
      use: content.services.amenities.list

  faq:
    patterns:
      - "domanda"
      - "faq"
    response:
      use: content.faq.general

  emergency:
    patterns:
      - "emergenza"
      - "aiuto"
    response:
      use: content.emergency.procedures

  contact:
    patterns:
      - "contatto"
      - "numero"
      - "assistenza"
    response:
      use: content.contact.support

fallback:
  enabled: true
