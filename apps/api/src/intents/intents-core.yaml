wifi:
  id: wifi
  priority: 100
  synonyms_it: ["wifi","wi-fi","internet","rete","password wifi","connessione"]
  synonyms_en: ["wifi","wi-fi","internet","network","wifi password","connection"]
  keywords_it: ["wifi","password"]
  keywords_en: ["wifi","password"]
  template_it: "Ecco il Wi-Fi:\nSSID: {{wifi.ssid}}\nPassword: {{wifi.password}}"
  template_en: "Here is the Wi-Fi:\nSSID: {{wifi.ssid}}\nPassword: {{wifi.password}}"

checkin:
  id: checkin
  priority: 90
  synonyms_it: ["check in","arrivo","orari checkin","orario arrivo","deposito bagagli"]
  synonyms_en: ["check in","arrival","arrival time","checkin hours","luggage drop"]
  keywords_it: ["check","in"]
  keywords_en: ["check","in"]
  template_it: "Check-in: dalle {{checkin.from}} alle {{checkin.to}}. {{checkin.late_policy_it}}"
  template_en: "Check-in: from {{checkin.from}} to {{checkin.to}}. {{checkin.late_policy_en}}"

rules:
  id: rules
  priority: 80
  synonyms_it: ["regole","silenzio","quiet hours","fumo","animali","feste"]
  synonyms_en: ["rules","quiet hours","smoke","pets","party"]
  template_it: "Regole: silenzio {{rules.quiet_hours}}. Fumo: {{#if rules.smoking}}consentito{{/if}}{{#if rules.smoking}}{{else}}{{/if}}{{#if rules.smoking}}{{else}}vietato{{/if}}. Animali: {{#if rules.pets}}consentiti{{/if}}{{#if rules.pets}}{{else}}{{/if}}{{#if rules.pets}}{{else}}non consentiti{{/if}}. {{rules.extra_it}}"
  template_en: "House rules: quiet {{rules.quiet_hours}}. Smoking: {{#if rules.smoking}}allowed{{/if}}{{#if rules.smoking}}{{else}}{{/if}}{{#if rules.smoking}}{{else}}not allowed{{/if}}. Pets: {{#if rules.pets}}allowed{{/if}}{{#if rules.pets}}{{else}}{{/if}}{{#if rules.pets}}{{else}}not allowed{{/if}}. {{rules.extra_en}}"
