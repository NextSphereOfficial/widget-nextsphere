version: 2

intents:

  ############################################################
  # A. META / SYSTEM
  ############################################################

  welcome:
    synonyms: ["benvenuto", "ciao", "salve"]
    keywords: ["welcome"]
    patterns: ["ciao", "buongiorno", "buonasera", "salve"]

  fallback:
    synonyms: []
    keywords: []
    patterns: []


  ############################################################
  # B. CHECK-IN / CHECK-OUT
  ############################################################

  checkin:
    synonyms: ["checkin", "check-in"]
    keywords: ["checkin", "check-in", "arrivo", "entrata"]
    patterns: [
      "come funziona il check in",
      "a che ora posso entrare",
      "quando posso arrivare",
      "orario check in"
    ]
    priority: 1

  early_checkin:
    synonyms: ["early checkin", "checkin anticipato"]
    keywords: ["early", "anticipato"]
    patterns: [
      "posso fare check in prima",
      "posso entrare prima",
      "arrivare prima è possibile"
    ]

  checkin_parking:
    synonyms: ["parcheggio check in"]
    keywords: ["parcheggio checkin", "parking checkin"]
    patterns: [
      "posso parcheggiare prima del check in",
      "dove parcheggio per il check in"
    ]

  checkout:
    synonyms: ["checkout", "check-out"]
    keywords: ["checkout", "partenza"]
    patterns: [
      "a che ora devo lasciare",
      "quando devo uscire",
      "orario check out"
    ]

  late_checkout:
    synonyms: ["late checkout", "late check-out"]
    keywords: ["late", "checkout tardi"]
    patterns: [
      "posso lasciare più tardi",
      "è possibile il late checkout",
      "vorrei uscire dopo"
    ]
    priority: 2

  checkout_keys:
    synonyms: ["chiavi checkout"]
    keywords: ["chiavi", "consegna chiavi"]
    patterns: [
      "dove lascio le chiavi",
      "come devo lasciare le chiavi"
    ]


