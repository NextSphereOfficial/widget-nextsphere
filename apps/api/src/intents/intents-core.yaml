# --- ADD / UPDATE: Wi-Fi intent
wifi:
  id: wifi
  priority: 100
  synonyms_it: [wifi, wi-fi, internet, rete, password wifi, connessione, ssid]
  synonyms_en: [wifi, wi-fi, internet, network, wifi password, connection, ssid]
  keywords_it: [wifi, password, rete, ssid]
  keywords_en: [wifi, password, network, ssid]
  patterns:
    - "(?i)password(.*)wifi"
    - "(?i)ssid"
  negative: ["porta", "portone", "cancello", "cassaforte", "lucchetto"]
  followups:
    it: []
    en: []
  actions:
    copyable_fields: ["wifi.password", "wifi.ssid"]
    cta:
      it: "Copia password"
      en: "Copy password"
  output:
    default: short
    rich: true

# --- ADD: Late Check-out
late_checkout:
  id: late_checkout
  priority: 85
  synonyms_it: [late checkout, check out tardi, uscire più tardi, posticipare checkout]
  synonyms_en: [late checkout, check out later, extend checkout, postpone checkout]
  keywords_it: [checkout, tardi, estensione, orario]
  keywords_en: [checkout, late, extension, time]
  patterns:
    - "(?i)late(.*)check(.*)out"
    - "(?i)posticipa(.*)checkout"
  negative: []
  followups:
    it: ["A che ora ti farebbe comodo? Posso verificare la disponibilità."]
    en: ["What time would work for you? I can check availability."]
  actions:
    cta:
      it: "Richiedi estensione"
      en: "Request extension"
  output:
    default: short
    rich: true

